<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Coachella Food+ · Borne commande</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #f5efe8;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #020106);
        }
        
        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=2070&auto=format');
            background-size: cover;
            background-position: center;
            filter: brightness(0.3) blur(6px);
            z-index: 0;
        }
        .overlay-dark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem 1rem 5rem;
            position: relative;
            z-index: 3;
        }

        .festival-header {
            text-align: center;
            margin-bottom: 1rem;
        }
        .logo {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD166, #F4A261, #E76F51);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo span {
            font-weight: 300;
            font-size: 1.6rem;
        }

        /* Login */
        .login-panel {
            background: rgba(18, 15, 32, 0.9);
            backdrop-filter: blur(14px);
            border-radius: 40px;
            padding: 2rem;
            text-align: center;
            border: 1px solid #F4A261;
        }
        .user-input-group {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        #userIdInput {
            background: #0a0818;
            border: 1px solid #F4A261;
            padding: 0.9rem 1.2rem;
            border-radius: 60px;
            font-size: 1.1rem;
            color: white;
            text-align: center;
            width: 180px;
            outline: none;
        }
        #loginBtn {
            background: #E76F51;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Navigation CATEGORIES */
        .categories-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            margin-bottom: 1rem;
            scrollbar-width: thin;
        }
        .cat-btn {
            background: rgba(30, 26, 58, 0.8);
            border: 1px solid #F4A26160;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active {
            background: #E76F51;
            border-color: #E76F51;
            color: white;
        }

        /* Grille produits (type MacDo) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .product-card {
            background: rgba(18, 15, 32, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 1rem 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.1s ease;
            border: 1px solid rgba(244, 162, 97, 0.3);
        }
        .product-card:active {
            transform: scale(0.97);
            background: #E76F5144;
        }
        .product-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        .product-name {
            font-weight: 700;
            font-size: 0.85rem;
        }
        .product-badge {
            font-size: 0.7rem;
            background: #E76F51cc;
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-top: 6px;
        }

        /* Panier / Validation */
        .cart-panel {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1rem;
            margin-top: 1.5rem;
            border-top: 2px solid #F4A261;
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .cart-items {
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
        }
        .cart-line {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0;
            border-bottom: 1px solid #2a2448;
        }
        .cart-total {
            text-align: right;
            margin: 0.5rem 0;
        }
        .validate-btn {
            background: #2a8e6e;
            width: 100%;
            padding: 0.8rem;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            color: white;
            cursor: pointer;
        }
        .validate-btn:disabled {
            background: #5a5a6e;
        }
        .reset-cart {
            background: none;
            border: 1px solid #E76F51;
            color: #E76F51;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            cursor: pointer;
        }

        /* Ticket */
        .ticket-screen {
            background: rgba(18, 15, 32, 0.95);
            border-radius: 40px;
            padding: 1.5rem;
            text-align: center;
        }
        .qr-container {
            background: white;
            padding: 1rem;
            border-radius: 24px;
            display: inline-block;
            margin: 1rem 0;
        }

        .footer-note {
            text-align: center;
            font-size: 0.6rem;
            color: #aaa;
            margin-top: 2rem;
        }
        .status-msg {
            text-align: center;
            font-size: 0.75rem;
            margin: 0.5rem;
            color: #FFD166;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="dynamic-bg"></div>
<div class="overlay-dark"></div>

<div class="container" id="app">
    <!-- LOGIN -->
    <div id="loginSection">
        <div class="login-panel">
            <div class="logo">Coachella<span>Food+</span></div>
            <div class="subtitle" style="margin: 0.5rem 0;">🎫 Entrez votre numéro à 4 chiffres</div>
            <div class="user-input-group">
                <input type="number" id="userIdInput" placeholder="1001" maxlength="4">
                <button id="loginBtn">VALIDER</button>
            </div>
            <div id="loginError" class="status-msg" style="color:#E76F51;"></div>
        </div>
    </div>

    <!-- COMMANDE -->
    <div id="orderingSection" style="display:none;">
        <div class="festival-header">
            <div class="logo">Coachella<span>Food+</span></div>
            <div id="userRemainingDisplay" style="font-size:0.7rem; margin-top: 4px; color:#F4A261;"></div>
        </div>

        <div class="categories-nav" id="categoriesNav"></div>
        <div id="productsGrid" class="products-grid"></div>

        <div class="cart-panel">
            <div class="cart-header">
                <span>🛒 Votre commande</span>
                <button id="clearCartBtn" class="reset-cart">Vider</button>
            </div>
            <div id="cartItemsList" class="cart-items">Aucun produit</div>
            <div id="cartTotal" class="cart-total"></div>
            <button id="validateOrderBtn" class="validate-btn">✅ VALIDER LA COMMANDE</button>
        </div>
    </div>

    <!-- TICKET -->
    <div id="ticketSection" style="display:none;">
        <div class="ticket-screen">
            <h3>🎟️ Ticket généré</h3>
            <p>Présentez ce QR Code à la buvette</p>
            <div id="qrcodeContainer" class="qr-container"></div>
            <button id="newOrderBtn" class="validate-btn" style="background:#F4A261;">Nouvelle commande</button>
        </div>
    </div>

    <div class="footer-note">
        création de MAIRE Anael pour la MDL2026, tout droit réservé<br>
        ⚡ Powered by Firebase + QRCode.js
    </div>
</div>

<script>
    // FIREBASE
    const firebaseConfig = { databaseURL: "https://coachellafoodplus-1323-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // PRODUITS (sera chargé depuis JSON)
    let allProducts = [];
    let categoriesMap = new Map(); // "cocktail" -> []
    let productMap = new Map();

    // État session
    let currentUserId = null;
    let userRemaining = { cocktails: 0, boissons: 0, nourriture: 0 };
    let cart = {}; // productId -> quantity
    let currentCategory = "cocktail";

    // Écouteurs Firebase
    let userQuotaListener = null;

    // === CHARGEMENT JSON PRODUITS ===
    async function loadProductsFromJSON() {
        try {
            const res = await fetch('https://honore-romane.fr/foodplus/produit/list.json');
            const data = await res.json();
            // Format attendu: { "cocktail":[...], "boissons":[...], "nourritures":[...] }
            allProducts = [];
            productMap.clear();
            categoriesMap.clear();
            for (let cat of ['cocktail', 'boissons', 'nourritures']) {
                const items = data[cat] || [];
                categoriesMap.set(cat, items);
                for (let p of items) {
                    p.category = cat;
                    allProducts.push(p);
                    productMap.set(p.ID, p);
                }
            }
            console.log("Produits chargés", allProducts);
        } catch(e) {
            console.error("Erreur chargement JSON", e);
            // Fallback minimal pour éviter plantage
            allProducts = [];
        }
    }

    // === VÉRIFICATION UTILISATEUR EXISTANT ===
    async function loginUser(userId) {
        const snapshot = await db.ref(`U/${userId}`).once('value');
        const data = snapshot.val();
        if (!data || typeof data !== 'object') {
            document.getElementById('loginError').innerText = "❌ Numéro invalide ou non enregistré";
            return false;
        }
        currentUserId = userId;
        // Récupérer les quotas restants
        userRemaining = {
            cocktails: data.c !== undefined ? data.c : 2,
            boissons: data.b !== undefined ? data.b : 4,
            nourriture: data.n !== undefined ? data.n : 8
        };
        // Écouter les changements temps réel (si admin modifie ou après commande)
        if(userQuotaListener) userQuotaListener.off();
        userQuotaListener = db.ref(`U/${userId}`).on('value', (snap) => {
            const val = snap.val();
            if(val) {
                userRemaining = {
                    cocktails: val.c ?? userRemaining.cocktails,
                    boissons: val.b ?? userRemaining.boissons,
                    nourriture: val.n ?? userRemaining.nourriture
                };
                updateRemainingUI();
                renderCartUI(); // pour réactiver validate si besoin
                renderProductsGrid(); // pour limiter l'ajout
            }
        });
        updateRemainingUI();
        return true;
    }

    function updateRemainingUI() {
        const el = document.getElementById('userRemainingDisplay');
        if(el) {
            el.innerHTML = `🍸 ${userRemaining.cocktails} cocktail(s) restants &nbsp;|&nbsp; 🥤 ${userRemaining.boissons} boisson(s) &nbsp;|&nbsp; 🍕 ${userRemaining.nourriture} plat(s)`;
        }
    }

    // === VÉRIFICATIONS LIMITES + STOCKS (Firebase S/) ===
    async function getProductStock(productId) {
        const snap = await db.ref(`S/${productId}`).once('value');
        let val = snap.val();
        if(val === null) return 0;
        if(typeof val === 'object') return val.stock ?? val;
        return val;
    }

    // Vérifier si on peut ajouter un produit (sans modifier)
    async function canAddToCart(product, currentCartQty = 0) {
        const newQty = currentCartQty + 1;
        // Limite catégorie utilisateur
        if(product.category === 'cocktail' && newQty > userRemaining.cocktails) return false;
        if(product.category === 'boissons' && newQty > userRemaining.boissons) return false;
        if(product.category === 'nourritures' && newQty > userRemaining.nourriture) return false;
        // Stock Firebase
        const stock = await getProductStock(product.ID);
        if(newQty > stock) return false;
        return true;
    }

    async function addToCart(productId) {
        const product = productMap.get(productId);
        if(!product) return;
        const currentQty = cart[productId] || 0;
        const ok = await canAddToCart(product, currentQty);
        if(!ok) {
            showStatus("❌ Limite atteinte ou stock insuffisant");
            return;
        }
        cart[productId] = currentQty + 1;
        renderProductsGrid();
        renderCartUI();
    }

    function removeFromCart(productId) {
        if(!cart[productId]) return;
        cart[productId]--;
        if(cart[productId] <= 0) delete cart[productId];
        renderProductsGrid();
        renderCartUI();
    }

    function clearCart() {
        cart = {};
        renderProductsGrid();
        renderCartUI();
    }

    // === VALIDATION SECURISÉE (une seule transaction firebase) ===
    async function validateOrder() {
        if(Object.keys(cart).length === 0) {
            showStatus("Panier vide");
            return;
        }
        showStatus("Vérification en cours...");

        // 1. Vérifier les stocks + limites de manière fiable
        let checks = [];
        for(let [prodId, qty] of Object.entries(cart)) {
            const prod = productMap.get(prodId);
            if(!prod) { showStatus("Erreur produit"); return; }
            const stock = await getProductStock(prodId);
            if(qty > stock) { showStatus(`Stock insuffisant pour ${prod.name}`); return; }
            if(prod.category === 'cocktail' && qty > userRemaining.cocktails) { showStatus(`Limite cocktail dépassée`); return; }
            if(prod.category === 'boissons' && qty > userRemaining.boissons) { showStatus(`Limite boisson dépassée`); return; }
            if(prod.category === 'nourritures' && qty > userRemaining.nourriture) { showStatus(`Limite nourriture dépassée`); return; }
            checks.push({prodId, qty, prod});
        }

        // 2. Préparer les updates
        const updates = {};
        // MàJ stocks
        for(let {prodId, qty} of checks) {
            const currentStock = await getProductStock(prodId);
            updates[`S/${prodId}`] = currentStock - qty;
        }
        // MàJ quotas user
        let newCocktails = userRemaining.cocktails;
        let newBoissons = userRemaining.boissons;
        let newFood = userRemaining.nourriture;
        for(let {prod, qty} of checks) {
            if(prod.category === 'cocktail') newCocktails -= qty;
            else if(prod.category === 'boissons') newBoissons -= qty;
            else if(prod.category === 'nourritures') newFood -= qty;
        }
        updates[`U/${currentUserId}`] = { c: newCocktails, b: newBoissons, n: newFood };
        
        // Création ticket
        const ticketId = `${currentUserId}_${Date.now()}_${Math.floor(Math.random()*10000)}`;
        const orderDetails = {};
        for(let {prodId, qty, prod} of checks) {
            orderDetails[prodId] = { name: prod.name, qty };
        }
        updates[`t/${ticketId}`] = {
            userId: currentUserId,
            items: orderDetails,
            timestamp: Date.now(),
            status: 'pending'
        };

        // 3. Exécution atomique
        try {
            await db.ref().update(updates);
            // Mise à jour locale immédiate (optimiste)
            for(let {prodId, qty} of checks) {
                // on ne modifie pas le stock local, mais on refresh à la prochaine vue
            }
            userRemaining = { cocktails: newCocktails, boissons: newBoissons, nourriture: newFood };
            updateRemainingUI();
            cart = {};
            renderProductsGrid();
            renderCartUI();
            showStatus("✅ Commande validée !");
            showTicketScreen(ticketId, orderDetails);
        } catch(e) {
            console.error(e);
            showStatus("❌ Erreur lors de la validation, veuillez réessayer");
        }
    }

    function showTicketScreen(ticketId, items) {
        document.getElementById('orderingSection').style.display = 'none';
        document.getElementById('ticketSection').style.display = 'block';
        const qrDiv = document.getElementById('qrcodeContainer');
        qrDiv.innerHTML = "";
        const ticketData = JSON.stringify({ ticketId, items, userId: currentUserId });
        new QRCode(qrDiv, {
            text: ticketData,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff"
        });
        // Surveiller si ticket a été consommé
        const ticketRef = db.ref(`t/${ticketId}`);
        const interval = setInterval(async () => {
            const snap = await ticketRef.once('value');
            if(!snap.exists()) {
                clearInterval(interval);
                if(confirm("Votre ticket a été utilisé. Retour à l'accueil.")) resetToLogin();
                else resetToLogin();
            }
        }, 4000);
        window._ticketInterval = interval;
    }

    function resetToLogin() {
        if(window._ticketInterval) clearInterval(window._ticketInterval);
        if(userQuotaListener) userQuotaListener.off();
        currentUserId = null;
        cart = {};
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('orderingSection').style.display = 'none';
        document.getElementById('ticketSection').style.display = 'none';
        document.getElementById('userIdInput').value = '';
        document.getElementById('loginError').innerText = '';
    }

    // === RENDU PRODUITS (MACDO STYLE) ===
    function renderProductsGrid() {
        const container = document.getElementById('productsGrid');
        if(!container) return;
        const products = categoriesMap.get(currentCategory) || [];
        if(products.length === 0) {
            container.innerHTML = '<div style="text-align:center">Aucun produit</div>';
            return;
        }
        let html = '';
        for(let prod of products) {
            const qtyInCart = cart[prod.ID] || 0;
            html += `
                <div class="product-card" data-id="${prod.ID}">
                    <img class="product-img" src="${prod.link}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1046/1046784.png'">
                    <div class="product-name">${prod.name}</div>
                    ${qtyInCart > 0 ? `<div class="product-badge">x${qtyInCart}</div>` : ''}
                </div>
            `;
        }
        container.innerHTML = html;
        // Attach events
        document.querySelectorAll('.product-card').forEach(card => {
            const id = card.getAttribute('data-id');
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                addToCart(id);
            });
            // Ajout contextuel pour retirer ? (optionnel: clic long? mais simple c'est mieux)
            card.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                removeFromCart(id);
                return false;
            });
        });
    }

    function renderCartUI() {
        const container = document.getElementById('cartItemsList');
        const totalContainer = document.getElementById('cartTotal');
        if(!container) return;
        const entries = Object.entries(cart);
        if(entries.length === 0) {
            container.innerHTML = 'Aucun produit';
            totalContainer.innerHTML = '';
            return;
        }
        let itemsHtml = '';
        let totalItems = 0;
        for(let [pid, qty] of entries) {
            const prod = productMap.get(pid);
            if(prod) {
                itemsHtml += `<div class="cart-line"><span>${prod.name}</span><span>x${qty} <button style="background:none; border:none; color:#E76F51; margin-left:8px;" onclick="window.removeCartItem('${pid}')">🗑️</button></span></div>`;
                totalItems += qty;
            }
        }
        container.innerHTML = itemsHtml;
        totalContainer.innerHTML = `Total : ${totalItems} article(s)`;
    }
    window.removeCartItem = (id) => removeFromCart(id);

    function showStatus(msg) {
        let statusDiv = document.getElementById('statusMessage');
        if(!statusDiv) {
            statusDiv = document.createElement('div');
            statusDiv.id = 'statusMessage';
            statusDiv.className = 'status-msg';
            document.getElementById('orderingSection').prepend(statusDiv);
        }
        statusDiv.innerText = msg;
        setTimeout(() => { if(statusDiv.innerText === msg) statusDiv.innerText = ''; }, 2000);
    }

    // === CATEGORIES NAVIGATION ===
    function buildCategoriesNav() {
        const nav = document.getElementById('categoriesNav');
        const cats = [
            { id: 'cocktail', label: '🍸 Cocktails', icon: '🍸' },
            { id: 'boissons', label: '🥤 Boissons', icon: '🥤' },
            { id: 'nourritures', label: '🍕 Nourritures', icon: '🍕' }
        ];
        nav.innerHTML = '';
        cats.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `cat-btn ${currentCategory === cat.id ? 'active' : ''}`;
            btn.innerText = cat.label;
            btn.addEventListener('click', () => {
                currentCategory = cat.id;
                buildCategoriesNav();
                renderProductsGrid();
            });
            nav.appendChild(btn);
        });
    }

    // === INIT ===
    window.onload = async () => {
        await loadProductsFromJSON();
        buildCategoriesNav();
        // Login
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const uid = document.getElementById('userIdInput').value.trim();
            if(!uid || uid.length !== 4) {
                document.getElementById('loginError').innerText = "Entrez 4 chiffres";
                return;
            }
            const ok = await loginUser(uid);
            if(ok) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('orderingSection').style.display = 'block';
                renderProductsGrid();
                renderCartUI();
            }
        });
        document.getElementById('clearCartBtn')?.addEventListener('click', clearCart);
        document.getElementById('validateOrderBtn')?.addEventListener('click', validateOrder);
        document.getElementById('newOrderBtn')?.addEventListener('click', resetToLogin);
    };
</script>
</body>
</html>
