<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>MDL 2026 · Élection Roi & Reine</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #fff3e8;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #020106);
        }
        
        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=2070&auto=format');
            background-size: cover;
            background-position: center;
            filter: brightness(0.25) blur(10px);
            z-index: 0;
        }
        .overlay-dark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.88) 100%);
            z-index: 1;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 1rem 4rem;
            position: relative;
            z-index: 3;
        }

        /* header style Coachella Food+ adapté */
        .festival-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD166, #F4A261, #E76F51);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(0,0,0,0.3);
        }
        .logo span {
            font-weight: 300;
            font-size: 1.7rem;
        }
        .sub {
            font-size: 0.85rem;
            opacity: 0.8;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        /* Navigation onglets */
        .tab-bar {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(18, 15, 32, 0.8);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(244, 162, 97, 0.5);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff3e8;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn.active {
            background: #E76F51;
            border-color: #FFD166;
            box-shadow: 0 0 12px rgba(231,111,81,0.6);
            transform: scale(1.02);
        }
        .tab-btn:active {
            transform: scale(0.97);
        }

        /* cartes stats / winner spotlight */
        .winner-spotlight {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
            border: 1px solid #FFD166;
        }
        .winner-name {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD966, #F4A261);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .winner-votes {
            font-size: 1.2rem;
            color: #FFC085;
        }

        /* Tableau classement */
        .ranking-card {
            background: rgba(18, 15, 32, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 1.2rem 0.8rem;
            border: 1px solid rgba(244, 162, 97, 0.5);
            overflow-x: auto;
        }
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }
        .ranking-table th {
            text-align: left;
            padding: 1rem 0.8rem;
            background: rgba(231, 111, 81, 0.3);
            font-weight: 600;
            color: #FFD6B0;
            border-bottom: 2px solid #F4A261;
        }
        .ranking-table td {
            padding: 0.9rem 0.8rem;
            border-bottom: 1px solid rgba(244, 162, 97, 0.25);
            font-weight: 500;
        }
        .rank-number {
            font-weight: 800;
            color: #FFB347;
            width: 65px;
        }
        .crown-icon {
            font-size: 1.2rem;
            margin-right: 6px;
        }
        .votes-count {
            font-weight: 700;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #FFD6B0;
            font-style: italic;
        }
        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #bbaacc;
            margin-top: 2.5rem;
            border-top: 1px dashed rgba(244,162,97,0.3);
            padding-top: 1.5rem;
        }
        .loading-spinner {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #F4A261;
        }
        .refresh-info {
            text-align: right;
            font-size: 0.7rem;
            margin-top: 0.5rem;
            color: #bbaacc;
        }
        @media (max-width: 680px) {
            .ranking-table th, .ranking-table td {
                padding: 0.7rem 0.4rem;
                font-size: 0.85rem;
            }
            .winner-name {
                font-size: 1.3rem;
            }
            .tab-btn {
                padding: 0.5rem 1.2rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="dynamic-bg"></div>
<div class="overlay-dark"></div>

<div class="container">
    <div class="festival-header">
        <div class="logo">MDL <span>2026</span></div>
        <div class="sub">Élection du Roi & de la Reine · Votes officiels</div>
    </div>

    <!-- onglets -->
    <div class="tab-bar">
        <button id="tabRoiBtn" class="tab-btn active">👑 Classement Roi</button>
        <button id="tabRieneBtn" class="tab-btn">👸 Classement Reine</button>
    </div>

    <!-- zone winner spotlight / mise en avant -->
    <div id="winnerSpotlight" class="winner-spotlight">
        <div class="loading-spinner">🎤 Chargement des votes...</div>
    </div>

    <!-- tableau principal -->
    <div class="ranking-card">
        <div id="rankingTableContainer">
            <div class="loading-spinner">📡 Synchronisation avec la base des votes</div>
        </div>
    </div>
    <div class="refresh-info">🔄 Les votes sont mis à jour en temps réel · données officielles</div>
    <div class="footer-note">
        création de MAIRE Anael pour la MDL2026, tout droit réservé<br>
        🏆 Votes en direct • Firerence sous le chapiteau
    </div>
</div>

<script>
    // ---------- CONFIG FIREBASE ----------
    // Configuration depuis votre base donnée dans le fichier JSON
    // URL: https://roietriene-4fb4a-default-rtdb.europe-west1.firebasedatabase.app/
    const firebaseConfig = {
        databaseURL: "https://roietriene-4fb4a-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // État global
    let currentTab = "roi";     // "roi" ou "riene"
    let roiList = [];            // [{ id, name, votes }]
    let rieneList = [];          // [{ id, name, votes }]

    // Références listeners
    let roiRef = null;
    let rieneRef = null;

    // Éléments DOM
    const tabRoiBtn = document.getElementById('tabRoiBtn');
    const tabRieneBtn = document.getElementById('tabRieneBtn');
    const rankingContainer = document.getElementById('rankingTableContainer');
    const winnerSpotlightDiv = document.getElementById('winnerSpotlight');

    // ---------- HELPERS ----------
    function formatVotes(votes) {
        return `${votes} vote${votes > 1 ? 's' : ''}`;
    }

    // Mise à jour du spotlight (affiche le/la leader)
    function updateSpotlight(list, type) {
        if (!list || list.length === 0) {
            winnerSpotlightDiv.innerHTML = `<div style="text-align:center">✨ Aucun vote enregistré pour le moment ✨</div>`;
            return;
        }
        const top = list[0];
        const isRoi = (type === 'roi');
        const crown = isRoi ? '👑' : '👸';
        const title = isRoi ? 'Roi' : 'Reine';
        winnerSpotlightDiv.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;">
                <span style="font-size:2rem;">${crown}</span>
                <div>
                    <div class="winner-name">${escapeHtml(top.name)}</div>
                    <div class="winner-votes">🏆 ${formatVotes(top.votes)} • Actuel${isRoi ? ' Roi' : 'lle Reine'}</div>
                </div>
            </div>
            <div style="margin-top:8px; font-size:0.8rem; opacity:0.8;">🥇 Leader du classement ${title}</div>
        `;
    }

    // Échappement basique pour éviter XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // Rendu du tableau selon la liste active (roiList ou rieneList)
    function renderRanking() {
        if (!rankingContainer) return;
        const isRoi = (currentTab === 'roi');
        const dataList = isRoi ? roiList : rieneList;
        
        if (!dataList.length) {
            rankingContainer.innerHTML = `<div class="empty-state">📭 Aucun candidat trouvé pour ${isRoi ? 'les Rois' : 'les Reines'}.<br>Les votes remonteront bientôt.</div>`;
            return;
        }

        // Construction tableau HTML
        let html = `<table class="ranking-table">
                        <thead>
                            <tr><th>#</th><th>Nom complet</th><th style="text-align:center">🗳️ Votes</th></tr>
                        </thead>
                        <tbody>`;
        dataList.forEach((candidate, idx) => {
            const rank = idx + 1;
            let medal = '';
            if (rank === 1) medal = '🥇 ';
            else if (rank === 2) medal = '🥈 ';
            else if (rank === 3) medal = '🥉 ';
            html += `<tr>
                        <td class="rank-number">${medal}${rank}</td>
                        <td><strong>${escapeHtml(candidate.name)}</strong></td>
                        <td style="text-align:center"><span class="votes-count">${candidate.votes} vote${candidate.votes > 1 ? 's' : ''}</span></td>
                     </tr>`;
        });
        html += `</tbody></table>`;
        rankingContainer.innerHTML = html;
    }

    // Mise à jour complète de l'affichage (spotlight + tableau)
    function refreshUI() {
        if (currentTab === 'roi') {
            updateSpotlight(roiList, 'roi');
            renderRanking();
        } else {
            updateSpotlight(rieneList, 'riene');
            renderRanking();
        }
    }

    // Tri par votes décroissants
    function sortByVotesDesc(arr) {
        return [...arr].sort((a, b) => b.votes - a.votes);
    }

    // Transformation des données brutes Firebase vers une liste { id, name, votes }
    function buildCandidatesFromSnapshot(snapshot, type) {
        const data = snapshot.val();
        if (!data || typeof data !== 'object') return [];
        const candidates = [];
        for (const [id, info] of Object.entries(data)) {
            if (info && typeof info === 'object') {
                let name = info.n || `Candidat ${id}`;
                // valeur des votes : champ 'v' (nombre de votes)
                let votes = (typeof info.v === 'number') ? info.v : 0;
                // dans le fichier JSON on a aussi vf, vg mais on garde le champ principal v
                candidates.push({
                    id: id,
                    name: name.trim(),
                    votes: votes
                });
            }
        }
        // filtrer les entrées avec vote null et trier
        const filtered = candidates.filter(c => typeof c.votes === 'number');
        return sortByVotesDesc(filtered);
    }

    // Initialisation des listeners temps réel (ROI + RIENE)
    function initRealtimeListeners() {
        // Ecoute sur "Roi"
        const roiPath = db.ref('Roi');
        if (roiRef) roiRef.off();
        roiRef = roiPath.on('value', (snapshot) => {
            roiList = buildCandidatesFromSnapshot(snapshot, 'roi');
            if (currentTab === 'roi') {
                refreshUI();
            } else {
                // si onglet reine, on garde roiList à jour mais sans refresh visuel
                // mais on pourrait pré-charger le spotlight si besoin, mais on ne refresh que si actif
                // néanmoins pour préserver le futur changement d'onglet, on garde juste les données.
                if (currentTab === 'riene') {
                    // seulement mettre à jour les données internes, mais pas l'affichage actif
                    // (car l'affichage est sur reine)
                } else {
                    refreshUI();
                }
            }
        }, (error) => {
            console.error("Erreur écoute Roi:", error);
            rankingContainer.innerHTML = `<div class="empty-state">⚠️ Erreur de connexion à la base des Rois. Rafraîchissez.</div>`;
        });

        // Ecoute sur "Riene" (dans le JSON la clé est "Riene" avec un 'e')
        const rienePath = db.ref('Riene');
        if (rieneRef) rieneRef.off();
        rieneRef = rienePath.on('value', (snapshot) => {
            rieneList = buildCandidatesFromSnapshot(snapshot, 'riene');
            if (currentTab === 'riene') {
                refreshUI();
            }
        }, (error) => {
            console.error("Erreur écoute Riene:", error);
        });
    }

    // Changer d'onglet
    function setActiveTab(tab) {
        currentTab = tab;
        if (tab === 'roi') {
            tabRoiBtn.classList.add('active');
            tabRieneBtn.classList.remove('active');
        } else {
            tabRieneBtn.classList.add('active');
            tabRoiBtn.classList.remove('active');
        }
        // forcer le refresh UI avec les données déjà chargées
        refreshUI();
    }

    // ----- Gestion initiale & vérification des données pour éviter les doublons vides -----
    async function fetchInitialData() {
        // On charge une première fois synchrone pour affichage rapide
        try {
            const [roiSnap, rieneSnap] = await Promise.all([
                db.ref('Roi').once('value'),
                db.ref('Riene').once('value')
            ]);
            roiList = buildCandidatesFromSnapshot(roiSnap, 'roi');
            rieneList = buildCandidatesFromSnapshot(rieneSnap, 'riene');
            refreshUI();
        } catch (err) {
            console.warn("Erreur chargement initial", err);
            rankingContainer.innerHTML = `<div class="empty-state">🔌 Impossible de contacter la base des votes. Vérifiez votre connexion.</div>`;
        }
        // Lance les listeners temps réel après le premier fetch
        initRealtimeListeners();
    }

    // ---- Option supplémentaire : afficher un message si pas de données sur 1er chargement ----
    // On s'assure que le DOM soit prêt
    document.addEventListener('DOMContentLoaded', () => {
        // Ajout des event listeners sur les onglets
        tabRoiBtn.addEventListener('click', () => {
            if (currentTab === 'roi') return;
            setActiveTab('roi');
        });
        tabRieneBtn.addEventListener('click', () => {
            if (currentTab === 'riene') return;
            setActiveTab('riene');
        });
        // lancement chargement
        fetchInitialData();
    });

    // Optionnel : petite animation pour clic onglet (feedback)
    // On nettoie les listeners à la fermeture ou si nécessaire (non nécessaire car single page)
</script>
</body>
</html>
