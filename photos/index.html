<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Coachella Photos · MDL 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #fff3e8;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #020106);
        }
        
        /* Fond d'écran dynamique comme sur les autres pages */
        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=2070&auto=format');
            background-size: cover;
            background-position: center;
            filter: brightness(0.3) blur(8px);
            z-index: 0;
        }
        .overlay-dark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.2rem 1rem 3rem;
            position: relative;
            z-index: 3;
        }

        /* En-tête style Coachella */
        .festival-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD166, #F4A261, #E76F51);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(0,0,0,0.3);
        }
        .logo span {
            font-weight: 300;
            font-size: 1.7rem;
        }
        .sub {
            font-size: 0.85rem;
            opacity: 0.8;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        /* Barre d'outils */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(18, 15, 32, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            border: 1px solid rgba(244, 162, 97, 0.4);
        }
        .photo-count {
            font-size: 0.9rem;
            color: #FFD6B0;
        }
        .download-all-btn {
            background: #E76F51;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .download-all-btn:active {
            transform: scale(0.96);
        }
        .refresh-btn {
            background: rgba(244, 162, 97, 0.2);
            border: 1px solid #F4A261;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #F4A261;
            cursor: pointer;
            transition: 0.1s;
        }
        .refresh-btn:active {
            transform: scale(0.96);
        }

        /* Grille des photos (responsive) */
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .photo-card {
            background: rgba(18, 15, 32, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(244, 162, 97, 0.4);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .photo-card:hover {
            transform: translateY(-4px);
            border-color: #F4A261;
        }
        .photo-card:active {
            transform: scale(0.98);
        }
        .photo-img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #0a0818;
        }
        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .photo-card:hover .photo-img {
            transform: scale(1.05);
        }
        .photo-info {
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }
        .photo-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: #FFD6B0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .download-btn {
            background: rgba(231, 111, 81, 0.8);
            border: none;
            border-radius: 30px;
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.1s;
        }
        .download-btn:active {
            transform: scale(0.94);
            background: #E76F51;
        }

        /* Modal lightbox */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }
        .modal-img {
            width: auto;
            max-width: 100%;
            max-height: 85vh;
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            border: 2px solid #F4A261;
        }
        .modal-download {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #E76F51;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: bold;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            white-space: nowrap;
        }
        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            color: #FFD166;
        }
        @media (max-width: 640px) {
            .modal-download {
                bottom: -45px;
                font-size: 0.8rem;
                padding: 0.4rem 1rem;
            }
            .modal-close {
                top: -35px;
            }
        }

        /* Loading / Empty states */
        .loading-spinner {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #F4A261;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #FFD6B0;
            font-style: italic;
            background: rgba(18, 15, 32, 0.6);
            border-radius: 48px;
        }
        .toast-animation {
            position: fixed;
            bottom: 20%;
            left: 20%;
            right: 20%;
            background: #2a8e6e;
            color: white;
            text-align: center;
            padding: 0.8rem;
            border-radius: 60px;
            font-weight: bold;
            z-index: 200;
            animation: fadeOutUp 1s ease forwards;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        @keyframes fadeOutUp {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-40px); display: none; }
        }
        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #bbaacc;
            margin-top: 2.5rem;
            border-top: 1px dashed rgba(244,162,97,0.3);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>
<div class="dynamic-bg"></div>
<div class="overlay-dark"></div>

<div class="container">
    <div class="festival-header">
        <div class="logo">Coachella<span>Photos</span></div>
        <div class="sub">📸 Les meilleurs moments du festival · Téléchargez vos souvenirs</div>
    </div>

    <div class="toolbar">
        <div class="photo-count" id="photoCount">📷 0 photos disponibles</div>
        <div style="display: flex; gap: 0.8rem;">
            <button id="refreshBtn" class="refresh-btn">⟳ Rafraîchir</button>
            <button id="downloadAllBtn" class="download-all-btn">📥 Tout télécharger (ZIP)</button>
        </div>
    </div>

    <div id="photosGridContainer" class="photos-grid">
        <div class="loading-spinner">🎞️ Chargement des photos du backstage...</div>
    </div>

    <div class="footer-note">
        création de MAIRE Anael pour la MDL2026, tout droit réservé
    </div>
</div>

<!-- Modal lightbox -->
<div id="lightboxModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" id="modalCloseBtn">✕</span>
        <img id="modalImage" class="modal-img" src="" alt="Aperçu">
        <button id="modalDownloadBtn" class="modal-download">📸 Télécharger cette photo</button>
    </div>
</div>

<script>
    // CONFIGURATION : dossier des images (chemin relatif depuis cette page)
    // Toutes les photos sont stockées dans "./images/"
    const IMAGES_PATH = "./images/";
    
    // Liste des extensions d'image supportées
    const SUPPORTED_EXTENSIONS = ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp'];
    
    // État global
    let photoList = [];      // [{ filename, fullUrl, extension }]
    let isLoading = false;
    
    // Éléments DOM
    const photosGrid = document.getElementById('photosGridContainer');
    const photoCountSpan = document.getElementById('photoCount');
    const refreshBtn = document.getElementById('refreshBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const lightboxModal = document.getElementById('lightboxModal');
    const modalImage = document.getElementById('modalImage');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalDownloadBtn = document.getElementById('modalDownloadBtn');
    
    // Variables pour la lightbox courante
    let currentPhotoFilename = null;
    let currentPhotoUrl = null;
    
    // ---------- FONCTIONS UTILITAIRES ----------
    function showToast(message) {
        const existingToast = document.querySelector('.toast-animation');
        if(existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-animation';
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            if(toast.parentNode) toast.remove();
        }, 2500);
    }
    
    // Téléchargement d'une image via anchor (force download)
    function downloadImage(url, filename) {
        fetch(url)
            .then(response => response.blob())
            .then(blob => {
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                showToast(`✅ Téléchargement : ${filename}`);
            })
            .catch(err => {
                console.error("Erreur téléchargement:", err);
                // Fallback : tentative en ouvrant dans un nouvel onglet (pas idéal)
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast(`⚠️ Téléchargement lancé (méthode alternative)`);
            });
    }
    
    async function fetchPhotoListFromManifest() {
        try {
            // Tente de charger le fichier manifest (list.json ou photos.json)
            const manifestUrl = `${IMAGES_PATH}photos.json`;
            const response = await fetch(manifestUrl, { cache: 'no-cache' });
            if (response.ok) {
                const data = await response.json();
                if (Array.isArray(data)) {
                    return data.filter(name => {
                        const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
                        return SUPPORTED_EXTENSIONS.includes(ext);
                    });
                } else if (data.files && Array.isArray(data.files)) {
                    return data.files.filter(name => {
                        const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
                        return SUPPORTED_EXTENSIONS.includes(ext);
                    });
                }
            }
        } catch(e) { console.warn("Pas de manifest photos.json", e); }
        
        // fallback: on tente de charger un fichier "list.txt" contenant les noms ligne par ligne
        try {
            const txtUrl = `${IMAGES_PATH}list.txt`;
            const txtResp = await fetch(txtUrl);
            if(txtResp.ok) {
                const text = await txtResp.text();
                const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                return lines.filter(name => {
                    const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
                    return SUPPORTED_EXTENSIONS.includes(ext);
                });
            }
        } catch(e) {}
        
        console.warn("Aucun fichier de listing (photos.json ou list.txt) trouvé dans ./images/");
        return [];
    }
    
    // Charger et afficher les photos
    async function loadPhotos() {
        if(isLoading) return;
        isLoading = true;
        photosGrid.innerHTML = `<div class="loading-spinner">📸 Recherche des photos dans ./images/ ...</div>`;
        
        try {
            const filenames = await fetchPhotoListFromManifest();
            if(!filenames || filenames.length === 0) {
                photosGrid.innerHTML = `
                    <div class="empty-state">
                        🖼️ Aucune photo trouvée dans le dossier "./images/"<br><br>
                        💡 Astuce : Créez un fichier <strong>photos.json</strong> (ou list.txt) dans le dossier images<br>
                        Format JSON: ["concert1.jpg", "backstage.png", "soiree.webp"]<br>
                        🎯 Placez vos photos et ce fichier dans le dossier ./images/
                    </div>
                `;
                photoCountSpan.innerText = `📷 0 photo disponible`;
                isLoading = false;
                return;
            }
            
            // Construire la liste des photos
            photoList = filenames.map(filename => ({
                filename: filename,
                fullUrl: `${IMAGES_PATH}${encodeURIComponent(filename)}`,
                extension: filename.substring(filename.lastIndexOf('.')).toLowerCase()
            }));
            
            photoCountSpan.innerText = `📷 ${photoList.length} photo${photoList.length > 1 ? 's' : ''}`;
            renderPhotoGrid();
        } catch(err) {
            console.error(err);
            photosGrid.innerHTML = `<div class="empty-state">⚠️ Erreur lors du chargement des photos. Vérifiez la console.</div>`;
        } finally {
            isLoading = false;
        }
    }
    
    function renderPhotoGrid() {
        if(!photoList.length) {
            photosGrid.innerHTML = `<div class="empty-state">✨ Aucune image à afficher pour le moment. Ajoutez des photos dans ./images/ et un fichier photos.json</div>`;
            return;
        }
        
        let html = '';
        for(let i = 0; i < photoList.length; i++) {
            const photo = photoList[i];
            const safeName = photo.filename.length > 35 ? photo.filename.substring(0, 32) + '...' : photo.filename;
            html += `
                <div class="photo-card" data-index="${i}" data-filename="${escapeHtmlAttr(photo.filename)}" data-url="${escapeHtmlAttr(photo.fullUrl)}">
                    <div class="photo-img-wrapper">
                        <img class="photo-img" src="${photo.fullUrl}" alt="${escapeHtmlAttr(photo.filename)}" loading="lazy" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1046/1046784.png'">
                    </div>
                    <div class="photo-info">
                        <span class="photo-name" title="${escapeHtmlAttr(photo.filename)}">📷 ${escapeHtml(safeName)}</span>
                        <button class="download-btn" data-filename="${escapeHtmlAttr(photo.filename)}" data-url="${escapeHtmlAttr(photo.fullUrl)}">📥 Télécharger</button>
                    </div>
                </div>
            `;
        }
        photosGrid.innerHTML = html;
        
        // Ajouter les événements sur chaque carte (ouvrir lightbox) et bouton download
        document.querySelectorAll('.photo-card').forEach(card => {
            const imgWrapper = card.querySelector('.photo-img-wrapper');
            const downloadBtn = card.querySelector('.download-btn');
            const filename = card.getAttribute('data-filename');
            const url = card.getAttribute('data-url');
            
            // Click sur la vignette (ou wrapper) pour ouvrir le modal
            if(imgWrapper) {
                imgWrapper.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLightbox(filename, url);
                });
            }
            // Click sur la carte elle-même si on veut
            card.addEventListener('click', (e) => {
                if(e.target === downloadBtn || downloadBtn.contains(e.target)) return;
                openLightbox(filename, url);
            });
            
            // Bouton télécharger
            if(downloadBtn) {
                downloadBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    downloadImage(url, filename);
                });
            }
        });
    }
    
    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    function escapeHtmlAttr(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    
    // Lightbox
    function openLightbox(filename, url) {
        currentPhotoFilename = filename;
        currentPhotoUrl = url;
        modalImage.src = url;
        lightboxModal.classList.add('active');
    }
    
    function closeLightbox() {
        lightboxModal.classList.remove('active');
        modalImage.src = '';
        currentPhotoFilename = null;
        currentPhotoUrl = null;
    }
    
    async function downloadAllPhotos() {
        if(!photoList.length) {
            showToast("Aucune photo à télécharger");
            return;
        }
        showToast(`📦 Démarrage du téléchargement de ${photoList.length} photo(s)...`);
        for(let i = 0; i < photoList.length; i++) {
            const photo = photoList[i];
            // Petit délai pour éviter que le navigateur bloque
            await new Promise(resolve => setTimeout(resolve, 400));
            downloadImage(photo.fullUrl, photo.filename);
        }
        showToast(`✅ ${photoList.length} photo(s) téléchargée(s) !`);
    }
    
    // Event listeners
    refreshBtn.addEventListener('click', () => {
        loadPhotos();
    });
    
    downloadAllBtn.addEventListener('click', () => {
        downloadAllPhotos();
    });
    
    modalCloseBtn.addEventListener('click', closeLightbox);
    modalDownloadBtn.addEventListener('click', () => {
        if(currentPhotoFilename && currentPhotoUrl) {
            downloadImage(currentPhotoUrl, currentPhotoFilename);
        }
    });
    lightboxModal.addEventListener('click', (e) => {
        if(e.target === lightboxModal) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape' && lightboxModal.classList.contains('active')) {
            closeLightbox();
        }
    });
    
    // Chargement initial
    loadPhotos();
</script>
</body>
</html>
