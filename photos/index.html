<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Coachella Photos · MDL 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #fff3e8;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #020106);
        }
        
        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=2070&auto=format');
            background-size: cover;
            background-position: center;
            filter: brightness(0.3) blur(8px);
            z-index: 0;
        }
        .overlay-dark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.2rem 1rem 3rem;
            position: relative;
            z-index: 3;
        }

        .festival-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD166, #F4A261, #E76F51);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(0,0,0,0.3);
        }
        .logo span {
            font-weight: 300;
            font-size: 1.7rem;
        }
        .sub {
            font-size: 0.85rem;
            opacity: 0.8;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(18, 15, 32, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            border: 1px solid rgba(244, 162, 97, 0.4);
        }
        .photo-count {
            font-size: 0.9rem;
            color: #FFD6B0;
        }
        .download-all-btn {
            background: #E76F51;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .download-all-btn:active {
            transform: scale(0.96);
        }
        .refresh-btn {
            background: rgba(244, 162, 97, 0.2);
            border: 1px solid #F4A261;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #F4A261;
            cursor: pointer;
            transition: 0.1s;
        }
        .refresh-btn:active {
            transform: scale(0.96);
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .photo-card {
            background: rgba(18, 15, 32, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(244, 162, 97, 0.4);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .photo-card:hover {
            transform: translateY(-4px);
            border-color: #F4A261;
        }
        .photo-card:active {
            transform: scale(0.98);
        }
        .photo-img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #0a0818;
        }
        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .photo-card:hover .photo-img {
            transform: scale(1.05);
        }
        .photo-info {
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }
        .photo-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: #FFD6B0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .action-buttons {
            display: flex;
            gap: 0.4rem;
        }
        .download-btn, .share-btn {
            background: rgba(231, 111, 81, 0.8);
            border: none;
            border-radius: 30px;
            padding: 0.3rem 0.7rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.1s;
        }
        .share-btn {
            background: rgba(244, 162, 97, 0.8);
        }
        .download-btn:active, .share-btn:active {
            transform: scale(0.94);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            cursor: pointer;
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }
        .modal-img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 24px;
            border: 2px solid #F4A261;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }
        .modal-actions {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            white-space: nowrap;
        }
        .modal-download, .modal-share {
            background: #E76F51;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: bold;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }
        .modal-share {
            background: #F4A261;
        }
        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            color: #FFD166;
        }
        @media (max-width: 640px) {
            .modal-actions {
                bottom: -45px;
            }
            .modal-download, .modal-share {
                font-size: 0.8rem;
                padding: 0.4rem 1rem;
            }
            .modal-close {
                top: -35px;
            }
        }

        .status {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
        }
        .status.loading {
            color: #FFD166;
        }
        .status.success {
            color: #90EE90;
        }
        .status.error {
            color: #FF6B6B;
        }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #F4A261, #E76F51);
            width: 0%;
            transition: width 0.3s ease;
        }
        .loading-spinner {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #F4A261;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #FFD6B0;
            font-style: italic;
            background: rgba(18, 15, 32, 0.6);
            border-radius: 48px;
        }
        .toast-animation {
            position: fixed;
            bottom: 20%;
            left: 20%;
            right: 20%;
            background: #2a8e6e;
            color: white;
            text-align: center;
            padding: 0.8rem;
            border-radius: 60px;
            font-weight: bold;
            z-index: 200;
            animation: fadeOutUp 1s ease forwards;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        @keyframes fadeOutUp {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-40px); display: none; }
        }
        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #bbaacc;
            margin-top: 2.5rem;
            border-top: 1px dashed rgba(244,162,97,0.3);
            padding-top: 1.5rem;
        }
        .filter-input {
            background: rgba(18, 15, 32, 0.8);
            border: 1px solid #F4A261;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            color: white;
            font-size: 0.85rem;
            outline: none;
            width: 200px;
        }
        .filter-input::placeholder {
            color: #FFD6B0;
            opacity: 0.6;
        }
    </style>
</head>
<body>
<div class="dynamic-bg"></div>
<div class="overlay-dark"></div>

<div class="container">
    <div class="festival-header">
        <div class="logo">Coachella<span>Photos</span></div>
        <div class="sub">📸 Téléchargez vos souvenirs</div>
    </div>

    <div class="toolbar">
        <div class="photo-count" id="photoCount">📷 0 photos disponibles</div>
        <div style="display: flex; gap: 0.8rem; align-items: center;">
            <input type="text" id="searchInput" class="filter-input" placeholder="🔍 Filtrer...">
            <button id="refreshBtn" class="refresh-btn">⟳ Rafraîchir</button>
            <button id="downloadAllBtn" class="download-all-btn">📥 Tout télécharger</button>
        </div>
    </div>

    <div id="statusDiv" class="status">Cliquez sur Rafraîchir pour charger les photos</div>
    <div id="progressBar" class="progress-bar" style="display: none;">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="photosGridContainer" class="photos-grid"></div>

    <div class="footer-note">
        création de MAIRE Anael pour la MDL2026, tout droit réservé
    </div>
</div>

<div id="lightboxModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" id="modalCloseBtn">✕</span>
        <img id="modalImage" class="modal-img" src="" alt="Aperçu">
        <div class="modal-actions">
            <button id="modalDownloadBtn" class="modal-download">📸 Télécharger</button>
            <button id="modalShareBtn" class="modal-share">🔗 Partager</button>
        </div>
    </div>
</div>

<script>
    const GITHUB_API_URL = 'https://api.github.com/repos/Lost-Cyrano/ball2026/contents/photos/images';
    const SITE_CREDIT = "MAIRE Anael";
    const RAW_BASE_URL = 'https://raw.githubusercontent.com/Lost-Cyrano/ball2026/main/photos/images/';
    
    let allPhotos = [];
    let currentPhotos = [];
    let currentPhotoFilename = null;
    let currentPhotoUrl = null;
    
    const photosGrid = document.getElementById('photosGridContainer');
    const photoCountSpan = document.getElementById('photoCount');
    const refreshBtn = document.getElementById('refreshBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const searchInput = document.getElementById('searchInput');
    const statusDiv = document.getElementById('statusDiv');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const lightboxModal = document.getElementById('lightboxModal');
    const modalImage = document.getElementById('modalImage');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalDownloadBtn = document.getElementById('modalDownloadBtn');
    const modalShareBtn = document.getElementById('modalShareBtn');
    
    function showToast(message) {
        const existingToast = document.querySelector('.toast-animation');
        if(existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-animation';
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            if(toast.parentNode) toast.remove();
        }, 2500);
    }
    
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function downloadImage(url, filename) {
        fetch(url)
            .then(response => response.blob())
            .then(blob => {
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                showToast(`✅ ${filename}`);
            })
            .catch(() => {
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast(`📸 ${filename}`);
            });
    }
    
    function generateShareLink(filename) {
        const currentUrl = window.location.href.split('?')[0];
        return `${currentUrl}?share=${encodeURIComponent(filename)}`;
    }
    
    function sharePhoto(filename, imageUrl) {
        const shareLink = generateShareLink(filename);
        const shareText = `Regarde cette image du Bale 2026 ! ${shareLink}\n\nCrédits : ${SITE_CREDIT} pour les sites du Bale`;
        
        if (navigator.share) {
            navigator.share({
                title: 'Coachella Photos',
                text: `Regarde cette image du Bale 2026 !`,
                url: shareLink
            }).catch(() => {
                fallbackShare(shareText, shareLink);
            });
        } else {
            fallbackShare(shareText, shareLink);
        }
    }
    
    function fallbackShare(text, link) {
        navigator.clipboard.writeText(text).then(() => {
            showToast(`🔗 Lien copié ! Partagez-le avec vos amis`);
        }).catch(() => {
            prompt("Partagez ce lien :", link);
        });
    }
    
    async function loadImagesFromGitHub() {
        const refreshBtnEl = refreshBtn;
        refreshBtnEl.disabled = true;
        progressBar.style.display = 'block';
        progressFill.style.width = '10%';
        
        statusDiv.className = 'status loading';
        statusDiv.innerHTML = '🔄 Chargement des photos depuis GitHub...';
        
        try {
            const response = await fetch(GITHUB_API_URL);
            progressFill.style.width = '50%';
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const files = await response.json();
            progressFill.style.width = '75%';
            
            const imageExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp'];
            const imageFiles = files.filter(file => {
                const ext = file.name.toLowerCase().substring(file.name.lastIndexOf('.'));
                return imageExtensions.includes(ext) && file.type === 'file';
            });
            
            if (imageFiles.length === 0) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '⚠️ Aucune photo trouvée dans le dossier';
                progressBar.style.display = 'none';
                refreshBtnEl.disabled = false;
                photosGrid.innerHTML = `<div class="empty-state">📷 Aucune photo disponible</div>`;
                photoCountSpan.innerText = `📷 0 photo`;
                return;
            }
            
            allPhotos = imageFiles.map(file => ({
                name: file.name,
                url: file.download_url,
                rawUrl: `${RAW_BASE_URL}${encodeURIComponent(file.name)}`,
                size: file.size
            }));
            
            currentPhotos = [...allPhotos];
            progressFill.style.width = '100%';
            
            setTimeout(() => {
                displayPhotos(currentPhotos);
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `✅ ${allPhotos.length} photo(s) chargée(s) avec succès !`;
                progressBar.style.display = 'none';
                refreshBtnEl.disabled = false;
                photoCountSpan.innerText = `📷 ${allPhotos.length} photo${allPhotos.length > 1 ? 's' : ''}`;
                progressFill.style.width = '0%';
            }, 300);
            
        } catch (error) {
            console.error('Erreur:', error);
            statusDiv.className = 'status error';
            statusDiv.innerHTML = `❌ Erreur de chargement: ${error.message}. Vérifiez que le dépôt est public.`;
            progressBar.style.display = 'none';
            refreshBtnEl.disabled = false;
            photosGrid.innerHTML = `<div class="empty-state">📷 Impossible de charger les photos</div>`;
            photoCountSpan.innerText = `📷 0 photo`;
        }
    }
    
    function displayPhotos(photos) {
        if (!photos.length) {
            photosGrid.innerHTML = `<div class="empty-state">📷 Aucune photo correspondante</div>`;
            return;
        }
        
        let html = '';
        for (let i = 0; i < photos.length; i++) {
            const photo = photos[i];
            const safeName = photo.name.length > 35 ? photo.name.substring(0, 32) + '...' : photo.name;
            const safeFilename = escapeHtml(photo.name);
            const safeUrl = escapeHtml(photo.url);
            html += `
                <div class="photo-card" data-index="${i}" data-filename="${safeFilename}" data-url="${safeUrl}">
                    <div class="photo-img-wrapper">
                        <img class="photo-img" src="${photo.url}" alt="${safeFilename}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23333%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2212%22%3E⚠️%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="photo-info">
                        <span class="photo-name" title="${safeFilename}">📷 ${safeName}</span>
                        <div class="action-buttons">
                            <button class="share-btn" data-filename="${safeFilename}" data-url="${safeUrl}">🔗</button>
                            <button class="download-btn" data-filename="${safeFilename}" data-url="${safeUrl}">📥</button>
                        </div>
                    </div>
                </div>
            `;
        }
        photosGrid.innerHTML = html;
        
        document.querySelectorAll('.photo-card').forEach(card => {
            const imgWrapper = card.querySelector('.photo-img-wrapper');
            const downloadBtn = card.querySelector('.download-btn');
            const shareBtn = card.querySelector('.share-btn');
            const filename = card.getAttribute('data-filename');
            const url = card.getAttribute('data-url');
            
            if (imgWrapper) {
                imgWrapper.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLightbox(filename, url);
                });
            }
            
            card.addEventListener('click', (e) => {
                if (e.target === downloadBtn || downloadBtn?.contains(e.target)) return;
                if (e.target === shareBtn || shareBtn?.contains(e.target)) return;
                openLightbox(filename, url);
            });
            
            if (downloadBtn) {
                downloadBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    downloadImage(url, filename);
                });
            }
            
            if (shareBtn) {
                shareBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    sharePhoto(filename, url);
                });
            }
        });
    }
    
    function filterPhotos() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        
        if (searchTerm === '') {
            currentPhotos = [...allPhotos];
        } else {
            currentPhotos = allPhotos.filter(photo => 
                photo.name.toLowerCase().includes(searchTerm)
            );
        }
        
        displayPhotos(currentPhotos);
        photoCountSpan.innerText = `📷 ${currentPhotos.length} photo${currentPhotos.length > 1 ? 's' : ''}`;
        
        if (allPhotos.length > 0) {
            statusDiv.className = 'status success';
            statusDiv.innerHTML = `🔍 ${currentPhotos.length} photo(s) sur ${allPhotos.length}`;
        }
    }
    
    function openLightbox(filename, url) {
        currentPhotoFilename = filename;
        currentPhotoUrl = url;
        modalImage.src = url;
        lightboxModal.classList.add('active');
    }
    
    function closeLightbox() {
        lightboxModal.classList.remove('active');
        modalImage.src = '';
        currentPhotoFilename = null;
        currentPhotoUrl = null;
    }
    
    async function downloadAllPhotos() {
        if (!allPhotos.length) {
            showToast("Aucune photo à télécharger");
            return;
        }
        showToast(`📦 Téléchargement de ${allPhotos.length} photo(s)...`);
        for (let i = 0; i < allPhotos.length; i++) {
            const photo = allPhotos[i];
            await new Promise(resolve => setTimeout(resolve, 350));
            downloadImage(photo.url, photo.name);
        }
    }
    
    function checkAndLoadSharedPhoto() {
        const urlParams = new URLSearchParams(window.location.search);
        const sharedFile = urlParams.get('share');
        if (sharedFile) {
            setTimeout(() => {
                const decodedFile = decodeURIComponent(sharedFile);
                const photoUrl = RAW_BASE_URL + decodedFile;
                const img = new Image();
                img.onload = () => {
                    openLightbox(decodedFile, photoUrl);
                    const newUrl = window.location.href.split('?')[0];
                    window.history.replaceState({}, document.title, newUrl);
                };
                img.onerror = () => {
                    showToast("📷 Photo non trouvée");
                };
                img.src = photoUrl;
            }, 500);
        }
    }
    
    refreshBtn.addEventListener('click', () => {
        loadImagesFromGitHub();
    });
    
    downloadAllBtn.addEventListener('click', () => {
        downloadAllPhotos();
    });
    
    searchInput.addEventListener('keyup', () => {
        filterPhotos();
    });
    
    modalCloseBtn.addEventListener('click', closeLightbox);
    modalDownloadBtn.addEventListener('click', () => {
        if (currentPhotoFilename && currentPhotoUrl) {
            downloadImage(currentPhotoUrl, currentPhotoFilename);
        }
    });
    modalShareBtn.addEventListener('click', () => {
        if (currentPhotoFilename && currentPhotoUrl) {
            sharePhoto(currentPhotoFilename, currentPhotoUrl);
        }
    });
    lightboxModal.addEventListener('click', (e) => {
        if (e.target === lightboxModal) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightboxModal.classList.contains('active')) {
            closeLightbox();
        }
    });
    
    loadImagesFromGitHub();
    checkAndLoadSharedPhoto();
</script>
</body>
</html>
