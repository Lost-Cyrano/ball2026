<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Coachella Photos · MDL 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #fff3e8;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #020106);
        }
        
        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=2070&auto=format');
            background-size: cover;
            background-position: center;
            filter: brightness(0.3) blur(8px);
            z-index: 0;
        }
        .overlay-dark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.2rem 1rem 3rem;
            position: relative;
            z-index: 3;
        }

        .festival-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD166, #F4A261, #E76F51);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(0,0,0,0.3);
        }
        .logo span {
            font-weight: 300;
            font-size: 1.7rem;
        }
        .sub {
            font-size: 0.85rem;
            opacity: 0.8;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(18, 15, 32, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            border: 1px solid rgba(244, 162, 97, 0.4);
        }
        .photo-count {
            font-size: 0.9rem;
            color: #FFD6B0;
        }
        .download-all-btn {
            background: #E76F51;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .download-all-btn:active {
            transform: scale(0.96);
        }
        .refresh-btn {
            background: rgba(244, 162, 97, 0.2);
            border: 1px solid #F4A261;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #F4A261;
            cursor: pointer;
            transition: 0.1s;
        }
        .refresh-btn:active {
            transform: scale(0.96);
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .photo-card {
            background: rgba(18, 15, 32, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(244, 162, 97, 0.4);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .photo-card:hover {
            transform: translateY(-4px);
            border-color: #F4A261;
        }
        .photo-card:active {
            transform: scale(0.98);
        }
        .photo-img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #0a0818;
        }
        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .photo-card:hover .photo-img {
            transform: scale(1.05);
        }
        .photo-info {
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }
        .photo-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: #FFD6B0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .download-btn {
            background: rgba(231, 111, 81, 0.8);
            border: none;
            border-radius: 30px;
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.1s;
        }
        .download-btn:active {
            transform: scale(0.94);
            background: #E76F51;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }
        .modal-img {
            width: auto;
            max-width: 100%;
            max-height: 85vh;
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            border: 2px solid #F4A261;
        }
        .modal-download {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #E76F51;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: bold;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            white-space: nowrap;
        }
        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            color: #FFD166;
        }
        @media (max-width: 640px) {
            .modal-download {
                bottom: -45px;
                font-size: 0.8rem;
                padding: 0.4rem 1rem;
            }
            .modal-close {
                top: -35px;
            }
        }

        .loading-spinner {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #F4A261;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #FFD6B0;
            font-style: italic;
            background: rgba(18, 15, 32, 0.6);
            border-radius: 48px;
        }
        .toast-animation {
            position: fixed;
            bottom: 20%;
            left: 20%;
            right: 20%;
            background: #2a8e6e;
            color: white;
            text-align: center;
            padding: 0.8rem;
            border-radius: 60px;
            font-weight: bold;
            z-index: 200;
            animation: fadeOutUp 1s ease forwards;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        @keyframes fadeOutUp {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-40px); display: none; }
        }
        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #bbaacc;
            margin-top: 2.5rem;
            border-top: 1px dashed rgba(244,162,97,0.3);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>
<div class="dynamic-bg"></div>
<div class="overlay-dark"></div>

<div class="container">
    <div class="festival-header">
        <div class="logo">Coachella<span>Photos</span></div>
        <div class="sub">📸 Les meilleurs moments du festival · Téléchargez vos souvenirs</div>
    </div>

    <div class="toolbar">
        <div class="photo-count" id="photoCount">📷 0 photos disponibles</div>
        <div style="display: flex; gap: 0.8rem;">
            <button id="refreshBtn" class="refresh-btn">⟳ Rafraîchir</button>
            <button id="downloadAllBtn" class="download-all-btn">📥 Tout télécharger</button>
        </div>
    </div>

    <div id="photosGridContainer" class="photos-grid">
        <div class="loading-spinner">🎞️ Chargement des photos...</div>
    </div>

    <div class="footer-note">
        création de MAIRE Anael pour la MDL2026, tout droit réservé
    </div>
</div>

<div id="lightboxModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" id="modalCloseBtn">✕</span>
        <img id="modalImage" class="modal-img" src="" alt="Aperçu">
        <button id="modalDownloadBtn" class="modal-download">📸 Télécharger cette photo</button>
    </div>
</div>

<script>
    const IMAGES_PATH = "./images/";
    const SUPPORTED_EXTENSIONS = ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp'];
    
    let photoList = [];
    let isLoading = false;
    let currentScanAttempt = 0;
    const MAX_SCAN_ATTEMPTS = 30;
    
    const photosGrid = document.getElementById('photosGridContainer');
    const photoCountSpan = document.getElementById('photoCount');
    const refreshBtn = document.getElementById('refreshBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const lightboxModal = document.getElementById('lightboxModal');
    const modalImage = document.getElementById('modalImage');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalDownloadBtn = document.getElementById('modalDownloadBtn');
    
    let currentPhotoFilename = null;
    let currentPhotoUrl = null;
    
    function showToast(message) {
        const existingToast = document.querySelector('.toast-animation');
        if(existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-animation';
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            if(toast.parentNode) toast.remove();
        }, 2500);
    }
    
    function downloadImage(url, filename) {
        fetch(url)
            .then(response => response.blob())
            .then(blob => {
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                showToast(`✅ ${filename}`);
            })
            .catch(() => {
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast(`📸 ${filename}`);
            });
    }
    
    async function testImageUrl(url, filename) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);
            img.src = url;
        });
    }
    
    async function scanImagesDynamic() {
        const extensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp'];
        const foundPhotos = [];
        const testIndexes = [];
        
        for(let i = 1; i <= MAX_SCAN_ATTEMPTS; i++) {
            testIndexes.push(i);
        }
        
        for(const idx of testIndexes) {
            for(const ext of extensions) {
                const filename = `photo_${idx}${ext}`;
                const url = `${IMAGES_PATH}${filename}`;
                const exists = await testImageUrl(url, filename);
                if(exists) {
                    foundPhotos.push({ filename, fullUrl: url, extension: ext });
                    break;
                }
            }
        }
        
        const commonNames = [
            '1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpg',
            '11.jpg', '12.jpg', '13.jpg', '14.jpg', '15.jpg', '16.jpg', '17.jpg', '18.jpg', '19.jpg', '20.jpg',
            '21.jpg', '22.jpg', '23.jpg', '24.jpg', '25.jpg', '26.jpg', '27.jpg', '28.jpg', '29.jpg', '30.jpg',
            '31.jpg', '32.jpg', '33.jpg', '34.jpg', '35.jpg', '36.jpg', '37.jpg', '38.jpg', '39.jpg', '40.jpg',
            '41.jpg', '42.jpg', '43.jpg', '44.jpg', '45.jpg', '46.jpg', '47.jpg', '48.jpg', '49.jpg', '50.jpg',
            'img1.jpg', 'img2.jpg', 'img3.jpg', 'img4.jpg', 'img5.jpg', 'img6.jpg', 'img7.jpg', 'img8.jpg', 'img9.jpg', 'img10.jpg',
            'image1.jpg', 'image2.jpg', 'image3.jpg', 'image4.jpg', 'image5.jpg', 'image6.jpg', 'image7.jpg', 'image8.jpg', 'image9.jpg', 'image10.jpg',
            'photo1.jpg', 'photo2.jpg', 'photo3.jpg', 'photo4.jpg', 'photo5.jpg', 'photo6.jpg', 'photo7.jpg', 'photo8.jpg', 'photo9.jpg', 'photo10.jpg',
            'IMG_0001.jpg', 'IMG_0002.jpg', 'IMG_0003.jpg', 'IMG_0004.jpg', 'IMG_0005.jpg',
            'DSC_0001.jpg', 'DSC_0002.jpg', 'DSC_0003.jpg', 'DSC_0004.jpg', 'DSC_0005.jpg'
        ];
        
        for(const fname of commonNames) {
            const ext = fname.substring(fname.lastIndexOf('.')).toLowerCase();
            if(!extensions.includes(ext)) continue;
            const url = `${IMAGES_PATH}${fname}`;
            const exists = await testImageUrl(url, fname);
            if(exists && !foundPhotos.some(p => p.filename === fname)) {
                foundPhotos.push({ filename: fname, fullUrl: url, extension: ext });
            }
        }
        
        return foundPhotos;
    }
    
    async function loadPhotos() {
        if(isLoading) return;
        isLoading = true;
        photosGrid.innerHTML = `<div class="loading-spinner">🔍 Scan des images en cours...</div>`;
        
        try {
            const scannedPhotos = await scanImagesDynamic();
            
            if(scannedPhotos.length === 0) {
                photosGrid.innerHTML = `<div class="empty-state">📷 Aucune photo disponible</div>`;
                photoCountSpan.innerText = `📷 0 photo`;
                photoList = [];
                isLoading = false;
                return;
            }
            
            photoList = scannedPhotos;
            photoCountSpan.innerText = `📷 ${photoList.length} photo${photoList.length > 1 ? 's' : ''}`;
            renderPhotoGrid();
        } catch(err) {
            console.error(err);
            photosGrid.innerHTML = `<div class="empty-state">📷 Aucune photo disponible</div>`;
            photoCountSpan.innerText = `📷 0 photo`;
        } finally {
            isLoading = false;
        }
    }
    
    function renderPhotoGrid() {
        if(!photoList.length) {
            photosGrid.innerHTML = `<div class="empty-state">📷 Aucune photo disponible</div>`;
            return;
        }
        
        let html = '';
        for(let i = 0; i < photoList.length; i++) {
            const photo = photoList[i];
            const safeName = photo.filename.length > 35 ? photo.filename.substring(0, 32) + '...' : photo.filename;
            const safeFilename = photo.filename.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            const safeUrl = photo.fullUrl.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            html += `
                <div class="photo-card" data-index="${i}" data-filename="${safeFilename}" data-url="${safeUrl}">
                    <div class="photo-img-wrapper">
                        <img class="photo-img" src="${photo.fullUrl}" alt="${safeFilename}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23333%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2212%22%3E⚠️%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="photo-info">
                        <span class="photo-name" title="${safeFilename}">📷 ${safeName}</span>
                        <button class="download-btn" data-filename="${safeFilename}" data-url="${safeUrl}">📥</button>
                    </div>
                </div>
            `;
        }
        photosGrid.innerHTML = html;
        
        document.querySelectorAll('.photo-card').forEach(card => {
            const imgWrapper = card.querySelector('.photo-img-wrapper');
            const downloadBtn = card.querySelector('.download-btn');
            const filename = card.getAttribute('data-filename');
            const url = card.getAttribute('data-url');
            
            if(imgWrapper) {
                imgWrapper.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLightbox(filename, url);
                });
            }
            
            card.addEventListener('click', (e) => {
                if(e.target === downloadBtn || downloadBtn.contains(e.target)) return;
                openLightbox(filename, url);
            });
            
            if(downloadBtn) {
                downloadBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    downloadImage(url, filename);
                });
            }
        });
    }
    
    function openLightbox(filename, url) {
        currentPhotoFilename = filename;
        currentPhotoUrl = url;
        modalImage.src = url;
        lightboxModal.classList.add('active');
    }
    
    function closeLightbox() {
        lightboxModal.classList.remove('active');
        modalImage.src = '';
        currentPhotoFilename = null;
        currentPhotoUrl = null;
    }
    
    async function downloadAllPhotos() {
        if(!photoList.length) {
            showToast("Aucune photo à télécharger");
            return;
        }
        showToast(`📦 Téléchargement de ${photoList.length} photo(s)...`);
        for(let i = 0; i < photoList.length; i++) {
            const photo = photoList[i];
            await new Promise(resolve => setTimeout(resolve, 300));
            downloadImage(photo.fullUrl, photo.filename);
        }
    }
    
    refreshBtn.addEventListener('click', () => {
        loadPhotos();
    });
    
    downloadAllBtn.addEventListener('click', () => {
        downloadAllPhotos();
    });
    
    modalCloseBtn.addEventListener('click', closeLightbox);
    modalDownloadBtn.addEventListener('click', () => {
        if(currentPhotoFilename && currentPhotoUrl) {
            downloadImage(currentPhotoUrl, currentPhotoFilename);
        }
    });
    lightboxModal.addEventListener('click', (e) => {
        if(e.target === lightboxModal) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape' && lightboxModal.classList.contains('active')) {
            closeLightbox();
        }
    });
    
    loadPhotos();
</script>
</body>
</html>
