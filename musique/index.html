<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Coachella Flow · Explorateur de musique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #050a15, #020408);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #f5f0e8;
            padding: 0 0 2rem 0;
            min-height: 100vh;
        }

        /* Container principal style festival */
        .container {
            max-width: 580px;
            margin: 0 auto;
            padding: 1.2rem 1rem 2rem;
        }

        /* Header épuré Coachella */
        .festival-header {
            text-align: center;
            margin-bottom: 1.8rem;
            position: relative;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFD166, #F4A261, #E76F51);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .logo span {
            font-weight: 300;
            font-size: 1.5rem;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: #f5e7c8;
        }
        .tagline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #F4A261;
            margin-top: 5px;
            opacity: 0.8;
        }

        /* Barre de recherche néon / festival */
        .search-arena {
            background: rgba(20, 15, 35, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 56px;
            padding: 0.4rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(244, 162, 97, 0.4);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .search-flex {
            display: flex;
            align-items: center;
            background: #0b0d17;
            border-radius: 52px;
            padding: 0.2rem 0.2rem 0.2rem 1.5rem;
            gap: 0.5rem;
        }
        .search-icon {
            color: #F4A261;
            font-size: 1.1rem;
        }
        #searchInput {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.9rem 0;
            font-size: 1rem;
            color: #FFE8D6;
            outline: none;
            font-weight: 500;
        }
        #searchInput::placeholder {
            color: #6a5c7a;
            font-weight: 400;
        }
        #searchButton {
            background: #E76F51;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.4rem;
            border-radius: 44px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        #searchButton:active {
            transform: scale(0.96);
            background: #cc5a3e;
        }

        /* Status discret */
        .status {
            text-align: center;
            font-size: 0.7rem;
            color: #F4A261;
            margin: 0.5rem 0 0.8rem;
            min-height: 2rem;
            letter-spacing: 0.3px;
        }

        /* Résultats: liste verticale pure (une musique en dessous de l'autre) */
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        /* Carte unique style festival - design épuré, image ronde/disque */
        .track-item {
            background: rgba(18, 20, 32, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.7rem;
            border: 1px solid rgba(244, 162, 97, 0.25);
            transition: transform 0.15s, background 0.2s;
            cursor: pointer;
        }
        .track-item:active {
            transform: scale(0.99);
            background: rgba(30, 28, 48, 0.9);
        }
        /* Image pochette style vinyle / carrée mais taille réduite */
        .track-img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            object-fit: cover;
            background: #1e1b2c;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .track-info {
            flex: 1;
            overflow: hidden;
        }
        .track-title {
            font-weight: 700;
            font-size: 1rem;
            color: #FFE8D6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
        }
        .track-artist {
            font-size: 0.75rem;
            color: #F4A261;
            margin-top: 4px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .empty-state {
            background: rgba(0,0,0,0.4);
            border-radius: 28px;
            text-align: center;
            padding: 2.5rem 1.5rem;
            color: #bfa98e;
            font-size: 0.9rem;
            border: 1px dashed #F4A26140;
        }
        /* Bouton "afficher plus" discret */
        .load-more-btn {
            background: transparent;
            border: 1px solid #F4A261;
            color: #F4A261;
            padding: 0.7rem 1.5rem;
            border-radius: 44px;
            font-weight: 500;
            font-size: 0.8rem;
            margin-top: 1.5rem;
            width: fit-content;
            align-self: center;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .load-more-btn:active {
            background: #F4A26120;
            transform: scale(0.96);
        }
        .footer-note {
            text-align: center;
            font-size: 0.6rem;
            color: #5e5270;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #2e253e;
        }
        /* Aucun élément superflu */
        .hidden {
            display: none;
        }
        /* adaptation mobile parfaite */
        @media (max-width: 550px) {
            .container {
                padding: 1rem 0.9rem 2rem;
            }
            .track-img {
                width: 56px;
                height: 56px;
                border-radius: 14px;
            }
            .track-title {
                font-size: 0.9rem;
            }
            .search-flex {
                padding-left: 1rem;
            }
            #searchButton {
                padding: 0.5rem 1.2rem;
            }
        }
        /* scroll smooth */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="festival-header">
        <div class="logo">Coachella<span>Flow</span></div>
        <div class="tagline">FIND YOUR SOUND</div>
    </div>

    <div class="search-arena">
        <div class="search-flex">
            <div class="search-icon">🎵</div>
            <input type="text" id="searchInput" placeholder="Artiste ou titre ..." autocomplete="off">
            <button id="searchButton">Chercher</button>
        </div>
    </div>
    <div id="statusMessage" class="status"></div>

    <!-- Liste verticale des morceaux -->
    <div id="trackListContainer" class="track-list"></div>

    <!-- Bouton pour afficher plus (discret) -->
    <div id="loadMoreWrapper" style="display: flex; justify-content: center;">
        <button id="loadMoreBtn" class="load-more-btn" style="display: none;">＋ AFFICHER PLUS</button>
    </div>

    <div class="footer-note">
        creation de MAIRE Anael pour la MDL2026, tout droit reservé
    </div>
</div>

<script>
    (function() {
        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchButton');
        const trackContainer = document.getElementById('trackListContainer');
        const statusDiv = document.getElementById('statusMessage');
        const loadMoreBtn = document.getElementById('loadMoreBtn');

        // État des résultats
        let currentTracks = [];        // liste complète des pistes (objets enrichis)
        let displayedCount = 0;         // nombre actuellement affiché
        const BATCH_SIZE = 4;           // afficher 4 par 4
        let isLoadingMore = false;
        let currentQuery = "";

        // Helper échappement
        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }

        // Nettoyage de la requête
        function cleanQuery(q) {
            return q.trim().replace(/\s+/g, ' ');
        }

        // Extraire nom artiste depuis un recording MusicBrainz
        function getArtistName(recording) {
            if(recording['artist-credit'] && recording['artist-credit'].length > 0) {
                const first = recording['artist-credit'][0];
                if(first.name) return first.name;
                if(first.artist && first.artist.name) return first.artist.name;
            }
            if(recording.artists && recording.artists[0]) return recording.artists[0].name;
            return "Artiste";
        }

        // Fonction pour récupérer une image de couverture (optimisée)
        // On tente via release Mbid ou via enregistrement.
        async function fetchCoverArt(recordingId, releaseMbid) {
            if(releaseMbid) {
                const coverUrl = `https://coverartarchive.org/release/${releaseMbid}/front-150`;
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 1800);
                    const res = await fetch(coverUrl, { method: 'HEAD', signal: controller.signal });
                    clearTimeout(timeoutId);
                    if(res.ok) return coverUrl;
                } catch(e) {}
            }
            // Fallback: chercher via l'inc release
            if(recordingId) {
                try {
                    const url = `https://musicbrainz.org/ws/2/recording/${recordingId}?inc=releases&fmt=json`;
                    const response = await fetch(url, {
                        headers: { 'User-Agent': 'CoachellaFlow/1.0 (contact@festival)' }
                    });
                    if(response.ok) {
                        const data = await response.json();
                        const releases = data.releases || [];
                        if(releases.length > 0) {
                            const firstReleaseId = releases[0].id;
                            const coverTest = `https://coverartarchive.org/release/${firstReleaseId}/front-150`;
                            const check = await fetch(coverTest, { method: 'HEAD' });
                            if(check.ok) return coverTest;
                        }
                    }
                } catch(e) {}
            }
            return null;
        }

        // Charger les images pour un lot de tracks (pour affichage progressif)
        async function loadImagesForTracks(tracksSlice, startIndex) {
            for(let i = 0; i < tracksSlice.length; i++) {
                const track = tracksSlice[i];
                const globalIdx = startIndex + i;
                const cardElement = document.querySelector(`.track-item[data-track-idx="${globalIdx}"]`);
                if(!cardElement) continue;
                const imgElement = cardElement.querySelector('.track-img');
                if(!imgElement) continue;
                // Si déjà une image réelle chargée, éviter double
                if(imgElement.src && !imgElement.src.includes('data:image/svg')) continue;
                
                let cover = null;
                if(track.releaseMbid) {
                    cover = await fetchCoverArt(track.id, track.releaseMbid);
                }
                if(!cover && track.id) {
                    cover = await fetchCoverArt(track.id, null);
                }
                if(cover) {
                    imgElement.src = cover;
                    imgElement.style.objectFit = "cover";
                } else {
                    // Icône minimaliste style disque
                    imgElement.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23F4A26125' stroke='%23F4A261' stroke-width='1.5'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%23F4A261'/%3E%3C/svg%3E";
                    imgElement.style.objectFit = "contain";
                    imgElement.style.padding = "8px";
                }
            }
        }

        // Afficher les N premiers morceaux (batch)
        function renderBatch() {
            if(!currentTracks.length) {
                trackContainer.innerHTML = `<div class="empty-state">✨ Aucune musique trouvée<br>Essayez un artiste ou un titre</div>`;
                loadMoreBtn.style.display = "none";
                return;
            }
            
            const remaining = currentTracks.length - displayedCount;
            const take = Math.min(BATCH_SIZE, remaining);
            if(take <= 0) {
                if(currentTracks.length > 0 && displayedCount >= currentTracks.length) {
                    loadMoreBtn.style.display = "none";
                }
                return;
            }
            
            const newTracksSlice = currentTracks.slice(displayedCount, displayedCount + take);
            // Générer le HTML pour ces nouvelles cartes
            const htmlSlice = newTracksSlice.map((track, idx) => {
                const realIndex = displayedCount + idx;
                const titleEsc = escapeHtml(track.title);
                const artistEsc = escapeHtml(track.artist);
                // Pas de lien externe, seulement l'image + titres
                return `
                    <div class="track-item" data-track-idx="${realIndex}">
                        <img class="track-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%232e2a42' stroke='%23F4A261' stroke-width='1'/%3E%3Cpath fill='%23F4A261' d='M40 35 L70 50 L40 65 Z'/%3E%3C/svg%3E" alt="cover">
                        <div class="track-info">
                            <div class="track-title">${titleEsc}</div>
                            <div class="track-artist">${artistEsc}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            if(displayedCount === 0) {
                trackContainer.innerHTML = htmlSlice;
            } else {
                trackContainer.insertAdjacentHTML('beforeend', htmlSlice);
            }
            
            // Chargement des images en arrière-plan pour ce nouveau batch
            loadImagesForTracks(newTracksSlice, displayedCount);
            
            displayedCount += take;
            
            // Gérer l'affichage du bouton "plus"
            if(displayedCount >= currentTracks.length) {
                loadMoreBtn.style.display = "none";
            } else {
                loadMoreBtn.style.display = "flex";
            }
        }
        
        // Fonction pour réinitialiser et charger les 4 premières cartes
        function resetAndDisplayFirstBatch(tracks) {
            currentTracks = tracks;
            displayedCount = 0;
            trackContainer.innerHTML = '';
            if(tracks.length === 0) {
                renderBatch(); // affiche empty message
                return;
            }
            renderBatch();
        }
        
        // Charger plus de morceaux
        function loadMore() {
            if(isLoadingMore) return;
            if(displayedCount >= currentTracks.length) {
                loadMoreBtn.style.display = "none";
                return;
            }
            isLoadingMore = true;
            // Petit délai pour fluidité (chargement images)
            setTimeout(() => {
                renderBatch();
                isLoadingMore = false;
            }, 80);
        }
        
        // -------- Tri intelligent des résultats selon pertinence + popularité ----------
        // MusicBrainz ne fournit pas de métrique de popularité directe, on va utiliser une heuristique :
        // - score interne (si dispo dans l'API)
        // - les pistes avec un plus grand nombre de releases associées = plus populaire potentiel
        // - ordre alphabétique mais on privilégie la correspondance exacte du query dans titre/artiste
        function smartSort(tracksArray, searchTerm) {
            if(!searchTerm || tracksArray.length <= 1) return tracksArray;
            const lowerTerm = searchTerm.toLowerCase();
            
            // Calcul d'un score de pertinence
            const scored = tracksArray.map(track => {
                let score = 0;
                const title = (track.title || '').toLowerCase();
                const artist = (track.artist || '').toLowerCase();
                // correspondance exacte du terme dans le titre boost
                if(title === lowerTerm) score += 100;
                else if(title.includes(lowerTerm)) score += 50;
                if(artist === lowerTerm) score += 80;
                else if(artist.includes(lowerTerm)) score += 40;
                // Si le terme est composé de mots, vérifier chaque mot
                const words = lowerTerm.split(/\s+/);
                for(let w of words) {
                    if(w.length > 2) {
                        if(title.includes(w)) score += 15;
                        if(artist.includes(w)) score += 12;
                    }
                }
                // Ajouter une métrique de "popularité artificielle": nombre de releases (si dispo)
                let releaseCount = 0;
                if(track.releasesCount) releaseCount = track.releasesCount;
                else if(track.raw && track.raw.releases) releaseCount = track.raw.releases.length;
                else if(track.releaseMbid) releaseCount = 1;
                score += Math.min(releaseCount * 3, 25);
                
                // Préférer les titres plus courts (souvent singles)
                if(title.length < 40 && title.length > 2) score += 5;
                return { track, score };
            });
            scored.sort((a,b) => b.score - a.score);
            return scored.map(s => s.track);
        }
        
        // ----- Recherche principale avec MusicBrainz + tri & dédoublonnage strict -----
        async function searchMusic(queryRaw) {
            const query = cleanQuery(queryRaw);
            if(!query) return [];
            const url = `https://musicbrainz.org/ws/2/recording?query=${encodeURIComponent(query)}&limit=45&fmt=json`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            try {
                const response = await fetch(url, {
                    headers: { 'Accept': 'application/json', 'User-Agent': 'CoachellaFlow/2.0 (contact)' },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if(!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                let recordings = data.recordings || [];
                recordings = recordings.filter(rec => rec.title && rec.title.trim().length > 0);
                
                // enrichir chaque piste
                const enriched = [];
                const seenMap = new Map(); // dédoublonnage (titre+artiste normalisé)
                for(let rec of recordings) {
                    const artist = getArtistName(rec);
                    const title = rec.title;
                    const key = `${title.toLowerCase().trim()}|${artist.toLowerCase().trim()}`;
                    if(seenMap.has(key)) continue;
                    seenMap.set(key, true);
                    
                    let releaseMbid = null;
                    let releasesCount = 0;
                    if(rec.releases && rec.releases.length) {
                        releaseMbid = rec.releases[0].id;
                        releasesCount = rec.releases.length;
                    } else if(rec['release-list'] && rec['release-list'].length) {
                        releaseMbid = rec['release-list'][0].id;
                        releasesCount = rec['release-list'].length;
                    }
                    enriched.push({
                        id: rec.id,
                        title: title,
                        artist: artist,
                        releaseMbid: releaseMbid,
                        releasesCount: releasesCount,
                        raw: rec
                    });
                }
                // Tri intelligent selon la recherche originale
                const sortedTracks = smartSort(enriched, query);
                return sortedTracks;
            } catch(err) {
                console.error(err);
                throw new Error(err.name === 'AbortError' ? "Timeout" : "Erreur réseau");
            }
        }
        
        // Afficher le status et lancer la recherche complète
        async function performSearch() {
            let raw = searchInput.value;
            const query = cleanQuery(raw);
            if(query === "") {
                statusDiv.innerHTML = "🎤 Saisissez un artiste ou un titre";
                trackContainer.innerHTML = `<div class="empty-state">🌴 Tapez un nom pour démarrer la recherche</div>`;
                loadMoreBtn.style.display = "none";
                currentTracks = [];
                displayedCount = 0;
                return;
            }
            currentQuery = query;
            statusDiv.innerHTML = `<span>🌀 Recherche de "${escapeHtml(query)}" ...</span>`;
            trackContainer.innerHTML = `<div class="empty-state" style="text-align:center;">🎧 Chargement des morceaux...</div>`;
            loadMoreBtn.style.display = "none";
            
            try {
                const tracks = await searchMusic(query);
                if(tracks.length === 0) {
                    statusDiv.innerHTML = `⚠️ Aucun résultat pour "${escapeHtml(query)}"`;
                    trackContainer.innerHTML = `<div class="empty-state">🎶 Aucune musique trouvée<br>Essayez un autre mot-clé</div>`;
                    currentTracks = [];
                    displayedCount = 0;
                    return;
                }
                statusDiv.innerHTML = `✨ ${tracks.length} morceaux trouvés (${Math.min(BATCH_SIZE, tracks.length)} affichés)`;
                resetAndDisplayFirstBatch(tracks);
            } catch(err) {
                statusDiv.innerHTML = `❌ Erreur: ${err.message}`;
                trackContainer.innerHTML = `<div class="empty-state">⚠️ Problème de connexion, réessayez</div>`;
                loadMoreBtn.style.display = "none";
                currentTracks = [];
            }
        }
        
        // Event listeners
        searchBtn.addEventListener('click', () => performSearch());
        searchInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });
        loadMoreBtn.addEventListener('click', () => loadMore());
        
        // Petit placeholder propre
        searchInput.placeholder = "ex: Tame Impala, Doja Cat, Tairo";
        statusDiv.innerHTML = "⚡ Coachella vibes · recherche instantanée";
    })();
</script>
</body>
</html>
